[project]
name = "layout-classify"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "huggingface-hub>=2.2.0",
    "imagehash>=4.3.2",
    "joblib>=1.6.0",
    "numpy>=2.5.4",
    "pdfplumber>=0.11.10",
    "pillow>=13.0.0",
    "pypdf>=6.21.1",
    "pypdfium2>=5.14.0",
    "pytesseract>=0.3.13",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "torch>=2.14.1",
    "transformers>=5.20.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
